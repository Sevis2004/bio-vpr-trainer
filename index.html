<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Биология 6 класс — тренажёр ВПР/МЦКО</title>
    <meta
      name="description"
      content="Статический web-тренажёр по биологии 6 класса в стиле ВПР/МЦКО."
    />
    <link rel="preload" href="data/variants/index.json" as="fetch" crossorigin="anonymous" />
    <style>
      :root {
        --bg: #f2f7f4;
        --panel: #ffffff;
        --text: #193026;
        --muted: #62746c;
        --brand: #167a4a;
        --brand-dark: #0d5f38;
        --border: #d7e5dc;
        --danger: #b42318;
        --danger-bg: #fff1f0;
        --success: #0f6f3f;
        --success-bg: #ecfdf3;
        --warning: #a15c07;
        --warning-bg: #fff8e6;
        --shadow: 0 12px 30px rgba(25, 48, 38, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(34, 197, 94, 0.14), transparent 32rem),
          var(--bg);
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      button,
      select,
      input {
        font: inherit;
      }

      .app-shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 56px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        margin-bottom: 24px;
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow);
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(1.75rem, 3vw, 2.8rem);
        line-height: 1.1;
      }

      .hero p {
        max-width: 760px;
        margin: 0;
        color: var(--muted);
      }

      .toolbar {
        display: grid;
        min-width: min(360px, 100%);
        gap: 12px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-weight: 700;
      }

      .field select,
      .task-select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        color: var(--text);
      }

      .progress-wrap {
        display: grid;
        gap: 6px;
      }

      .progress-label {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.95rem;
      }

      progress {
        width: 100%;
        height: 14px;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: #dbe9e0;
      }

      progress::-webkit-progress-bar {
        background: #dbe9e0;
      }

      progress::-webkit-progress-value,
      progress::-moz-progress-bar {
        background: linear-gradient(90deg, #22c55e, #15803d);
      }

      .status-line {
        min-height: 24px;
        margin: 12px 0 20px;
        color: var(--muted);
      }

      .tasks {
        display: grid;
        gap: 18px;
      }

      .task-card {
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 8px 20px rgba(25, 48, 38, 0.06);
      }

      .task-part.is-correct {
        border-color: rgba(15, 111, 63, 0.35);
        background: linear-gradient(0deg, rgba(236, 253, 243, 0.65), rgba(255, 255, 255, 0.92));
      }

      .task-part.is-partial {
        border-color: rgba(161, 92, 7, 0.35);
        background: linear-gradient(0deg, rgba(255, 248, 230, 0.72), rgba(255, 255, 255, 0.92));
      }

      .task-part.is-wrong {
        border-color: rgba(180, 35, 24, 0.35);
        background: linear-gradient(0deg, rgba(255, 241, 240, 0.72), rgba(255, 255, 255, 0.92));
      }

      .task-head {
        display: flex;
        gap: 12px;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .task-number {
        color: var(--brand-dark);
        font-size: 1.1rem;
        font-weight: 800;
      }

      .task-points {
        color: var(--muted);
        font-weight: 700;
      }

      .task-group-intro {
        display: grid;
        gap: 14px;
        margin-bottom: 16px;
      }

      .task-group-intro p {
        margin: 0;
        color: var(--text);
      }

      .task-group-intro img,
      .task-media img,
      .task-group-media img {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
      }

      .text-center {
        text-align: center;
      }

      .task-media,
      .task-group-media {
        display: grid;
        gap: 14px;
        margin-bottom: 16px;
      }

      .media-figure {
        width: fit-content;
        max-width: 100%;
        margin: 0;
      }

      .media-figure figcaption,
      .media-group-caption {
        margin-top: 8px;
        color: var(--muted);
        font-weight: 700;
        text-align: center;
      }

      .media-group-caption {
        flex-basis: 100%;
      }

      .dropdown-item .media-figure {
        margin-bottom: 10px;
      }

      .media-align-center {
        margin-right: auto;
        margin-left: auto;
      }

      .media-align-right {
        margin-left: auto;
      }

      .media-align-left {
        margin-right: auto;
      }

      .media-tiny {
        width: min(30%, 300px);
      }

      .media-small {
        width: min(42%, 420px);
      }

      .media-medium {
        width: min(62%, 640px);
      }

      .media-large {
        width: min(100%, 940px);
      }

      .media-full {
        width: 100%;
      }

      .media-layout-row,
      .media-layout-side-by-side {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
        justify-content: center;
      }

      .media-layout-row .media-figure,
      .media-layout-side-by-side .media-figure {
        flex: 0 1 var(--media-row-item-width, 260px);
      }

      .media-layout-column,
      .media-layout-image-with-slots {
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      .media-layout-tissueSet {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 14px;
        align-items: start;
        justify-content: center;
      }

      .media-layout-tissueSet .media-figure:first-child {
        grid-column: 1 / -1;
        justify-self: center;
      }

      .media-layout-tissueSet .media-figure:not(:first-child) {
        display: grid;
        grid-template-rows: 150px auto;
        justify-items: center;
        align-items: center;
        width: 100%;
        max-width: 170px;
        justify-self: center;
      }

      .media-layout-tissueSet .media-figure:not(:first-child) img {
        max-height: 150px;
        object-fit: contain;
      }


      .task-part[data-task-id="7.1"] .task-media {
        justify-items: center;
      }

      .task-part[data-task-id="7.1"] .media-figure {
        width: fit-content;
        max-width: min(100%, 520px);
      }

      .task-part[data-task-id="7.2"] .media-layout-row {
        align-items: flex-end;
      }

      .task-part[data-task-id="7.2"] .media-figure {
        flex-basis: 180px;
        max-width: 180px;
      }

      .task-part[data-task-id="7.2"] .media-figure img {
        max-height: 170px;
        object-fit: contain;
      }

      .task-card[data-task-no="9"] .task-group-media .media-figure {
        width: min(21%, 210px);
      }

      .task-part[data-task-id="10.1"] .task-intro-media-layout {
        grid-template-columns: minmax(0, 1fr) minmax(260px, 0.8fr);
      }

      .task-part[data-task-id="10.1"] .media-figure {
        width: min(100%, 520px);
      }

      .task-part[data-task-id="11.1"] .media-figure {
        width: min(36%, 360px);
      }

      .task-part[data-task-id="11.2"] .media-figure,
      .task-part[data-task-id="11.3"] .media-figure {
        width: min(55%, 550px);
      }

      .task-part[data-task-id="12К1"] .dropdown-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: stretch;
      }

      .task-part[data-task-id="12К1"] .dropdown-item {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
      }

      .task-part[data-task-id="12К1"] .dropdown-item .media-figure {
        display: grid;
        grid-template-rows: 240px auto;
        align-items: center;
        justify-items: center;
        width: 100%;
      }

      .task-part[data-task-id="12К1"] .dropdown-item img {
        width: 100%;
        max-height: 240px;
        object-fit: contain;
      }

      .task-card[data-task-no="14"] .task-group-media .media-figure:first-child {
        width: min(21%, 210px);
      }

      .task-card[data-task-no="15"] .media-layout-row {
        align-items: end;
      }

      .task-card[data-task-no="15"] .media-figure {
        display: grid;
        grid-template-rows: 260px auto;
        align-items: end;
        justify-items: center;
        flex: 0 1 320px;
        width: 100%;
      }

      .task-card[data-task-no="15"] .media-figure img {
        max-height: 260px;
        object-fit: contain;
      }

      .task-card[data-task-no="15"] .media-figure:first-child img {
        width: min(100%, 300px);
      }

      .task-card[data-task-no="15"] .media-figure:nth-child(2) img {
        max-height: 240px;
      }

      .task-part {
        padding: 16px;
        border: 1px solid transparent;
        border-radius: 18px;
      }

      .task-part + .task-part {
        margin-top: 14px;
      }

      .task-part h3 {
        margin: 0 0 10px;
        font-size: 1.08rem;
      }

      .task-part h3:empty {
        display: none;
      }

      .task-description {
        margin: 0 0 16px;
        color: var(--muted);
      }

      .options {
        display: grid;
        gap: 10px;
      }

      .option {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #fbfdfb;
        cursor: pointer;
      }

      .option input {
        margin-top: 4px;
        accent-color: var(--brand);
      }

      .option.is-right-answer {
        border-color: rgba(15, 111, 63, 0.55);
        background: var(--success-bg);
      }

      .dropdown-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }

      .task-intro-media-layout,
      .task-media-body-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(180px, 0.6fr);
        gap: 18px;
        align-items: start;
      }

      .task-media-body-layout {
        grid-template-columns: minmax(180px, 0.45fr) minmax(0, 1fr);
      }

      .task-media-side {
        margin-bottom: 0;
      }

      .task-media-body-content .dropdown-grid {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      .dropdown-item {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #fbfdfb;
      }

      .dropdown-item strong {
        display: block;
        margin-bottom: 8px;
      }

      .dnd-board {
        display: grid;
        gap: 16px;
      }

      .image-dnd-layout {
        grid-template-columns: minmax(220px, 0.78fr) minmax(130px, 180px);
        gap: 8px;
        align-items: center;
        justify-content: center;
      }

      .image-dnd-layout .image-dnd-media {
        justify-self: end;
      }

      .image-dnd-layout .dnd-controls {
        grid-column: 1 / -1;
      }

      .image-dnd-layout .dnd-slots {
        grid-template-columns: 1fr;
        align-self: stretch;
        align-content: space-around;
        gap: 18px;
        padding-left: 22px;
      }

      .image-dnd-layout .dnd-slot {
        position: relative;
      }

      .image-dnd-layout .dnd-slot::before {
        content: "";
        position: absolute;
        top: 50%;
        right: calc(100% + 2px);
        width: 24px;
        height: 2px;
        background: var(--brand);
        transform: translateY(-50%);
      }

      .image-dnd-layout .dnd-slot::after {
        content: "";
        position: absolute;
        top: 50%;
        right: calc(100% + 20px);
        width: 8px;
        height: 8px;
        border-bottom: 2px solid var(--brand);
        border-left: 2px solid var(--brand);
        transform: translateY(-50%) rotate(45deg);
      }

      .dnd-bank,
      .dnd-slots {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .dnd-card,
      .dnd-slot {
        min-height: 54px;
        padding: 12px;
        border: 2px dashed var(--border);
        border-radius: 14px;
        background: #fbfdfb;
      }

      .dnd-card {
        display: flex;
        align-items: center;
        justify-content: center;
        border-style: solid;
        background: #fff;
        box-shadow: 0 3px 10px rgba(25, 48, 38, 0.08);
        cursor: grab;
        user-select: none;
      }

      .dnd-card:active {
        cursor: grabbing;
      }

      .dnd-card.is-selected {
        outline: 3px solid rgba(22, 122, 74, 0.32);
        border-color: var(--brand);
      }

      .dnd-slot {
        display: grid;
        gap: 8px;
        align-content: start;
        min-height: 92px;
      }

      .dnd-slot.is-over {
        border-color: var(--brand);
        background: #eefbf3;
      }

      .correct-answer-summary {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }

      .correct-answer-text {
        color: var(--text);
        font-weight: 700;
      }

      .slot-label {
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 800;
      }

      .slot-label:empty {
        display: none;
      }

      .actions {
        position: sticky;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 24px;
        padding: 16px 0;
        background: linear-gradient(180deg, rgba(242, 247, 244, 0), var(--bg) 24%);
      }

      .btn {
        min-width: 140px;
        padding: 12px 18px;
        border: 1px solid transparent;
        border-radius: 14px;
        font-weight: 800;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--brand);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--brand-dark);
      }

      .btn-secondary {
        border-color: var(--border);
        background: #fff;
        color: var(--text);
      }

      .results {
        margin-top: 24px;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .results[hidden] {
        display: none;
      }

      .score-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin: 18px 0;
      }

      .score-card {
        padding: 16px;
        border-radius: 16px;
        background: #f6fbf7;
      }

      .score-card span {
        display: block;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .score-card strong {
        display: block;
        margin-top: 4px;
        font-size: 1.6rem;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #f6fbf7;
      }

      .badge {
        display: inline-block;
        padding: 4px 9px;
        border-radius: 999px;
        font-weight: 800;
        white-space: nowrap;
      }

      .badge.ok {
        background: var(--success-bg);
        color: var(--success);
      }

      .badge.partial {
        background: var(--warning-bg);
        color: var(--warning);
      }

      .badge.bad {
        background: var(--danger-bg);
        color: var(--danger);
      }

      .empty-state {
        padding: 22px;
        border: 1px dashed var(--border);
        border-radius: 18px;
        background: #fff;
        color: var(--muted);
      }

      @media (max-width: 820px) {
        .app-shell {
          width: min(100% - 20px, 1120px);
          padding-top: 10px;
        }

        .hero {
          grid-template-columns: 1fr;
          padding: 20px;
          border-radius: 20px;
        }

        .task-card,
        .results {
          padding: 16px;
          border-radius: 18px;
        }

        .actions {
          justify-content: stretch;
        }

        .btn {
          flex: 1 1 160px;
        }

        .media-tiny,
        .media-small,
        .media-medium {
          width: min(100%, 520px);
        }

        .media-layout-tissueSet,
        .task-part[data-task-id="12К1"] .dropdown-grid {
          grid-template-columns: 1fr;
        }

        .task-intro-media-layout,
        .task-media-body-layout,
        .image-dnd-layout,
        .task-part[data-task-id="10.1"] .task-intro-media-layout {
          grid-template-columns: 1fr;
        }

        .image-dnd-layout .image-dnd-media {
          justify-self: center;
        }

        .image-dnd-layout .dnd-slots {
          max-width: 260px;
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <h1>Биология 6 класс — тренажёр ВПР/МЦКО</h1>
          <p>
            Выберите вариант, ответьте на 16 заданий и нажмите «Проверить», чтобы увидеть баллы,
            процент, оценку, ошибки и правильные ответы.
          </p>
        </div>
        <div class="toolbar" aria-label="Панель управления вариантом">
          <div class="field">
            <label for="variantSelect">Вариант</label>
            <select id="variantSelect"></select>
          </div>
          <div class="progress-wrap">
            <div class="progress-label">
              <span>Прогресс</span>
              <strong id="progressText">0 из 0</strong>
            </div>
            <progress id="progressBar" max="100" value="0"></progress>
          </div>
        </div>
      </header>

      <div id="statusLine" class="status-line" role="status">Загрузка вариантов…</div>
      <section id="tasks" class="tasks" aria-live="polite"></section>

      <div class="actions">
        <button id="resetBtn" class="btn btn-secondary" type="button">Сбросить</button>
        <button id="checkBtn" class="btn btn-primary" type="button">Проверить</button>
      </div>

      <section id="results" class="results" hidden aria-live="polite"></section>
    </main>

    <!-- Yandex.Metrica counter placeholder -->
    <!-- Paste counter script here before deployment -->

    <script type="module" src="src/app.js"></script>
  </body>
</html>
